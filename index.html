<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personalia Management system</title>
  <link rel="icon" type="image/png" href="https://i.postimg.cc/XvXRjWQp/SIMGROUP-Logo-WEB-1png.png">
  <link rel="shortcut icon" type="image/png" href="https://i.postimg.cc/XvXRjWQp/SIMGROUP-Logo-WEB-1png.png">
  <link rel="apple-touch-icon" href="https://i.postimg.cc/XvXRjWQp/SIMGROUP-Logo-WEB-1png.png">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <iframe
    id="gasFrame"
    src=""
    allow="geolocation *; microphone *; camera *; clipboard-read; clipboard-write"
    allowfullscreen>
  </iframe>
  <script>
    (function () {
      const APP_URL = "https://script.google.com/macros/s/AKfycbzkcflbnYLH31F6Y90TI87r9Pwl1njvuDnfbsHXuk0S7v0KpISkaqO8pUN6V9I_YsMN/exec";
      const qs = new URLSearchParams(window.location.search);
      qs.set("pmsHost", window.location.origin + window.location.pathname);
      document.getElementById("gasFrame").src = APP_URL + "?" + qs.toString();
    })();
  </script>
</body>
</html>
